name: Generate Translations
on: workflow_dispatch
jobs:
  generate-translations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: WordPress POT/PO/MO Generator
      uses: strangerstudios/action-wp-pot-po-mo-generator@main
      with:
        generate_pot: 1
        generate_po: 1
        generate_mo: 1
        generate_lang_packs: 1
        merge_changes: 1
        headers: '{"Report-Msgid-Bugs-To":"mr.sayandey18@outlook.com","Last-Translator":"Sayan Dey <mr.sayandey18@outlook.com>","Language-Team":"Sayan Dey <mr.sayandey18@outlook.com>"}'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
